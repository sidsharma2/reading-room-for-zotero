name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
      - name: Plugin tests
        run: node --test plugin/test_tools.mjs plugin/test_connections.mjs plugin/test_organise.mjs plugin/test_attach.mjs
      - name: Build Reading Room Tools
        shell: bash
        run: |
          python plugin/build.py
          python -c "import hashlib; print(hashlib.sha256(open('plugin/reading-room-tools.xpi', 'rb').read()).hexdigest())" > plugin-sha256.txt
          cat plugin-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sha256-${{ matrix.os }}
          path: plugin-sha256.txt

  same-build:
    name: same plugin on macOS and Windows
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-sha256-*
      - name: Compare the two builds
        run: |
          cat plugin-sha256-*/plugin-sha256.txt
          # Windows writes the file with CRLF, so line endings are dropped before comparing.
          test "$(cat plugin-sha256-*/plugin-sha256.txt | tr -d '\r' | sort -u | wc -l)" -eq 1
